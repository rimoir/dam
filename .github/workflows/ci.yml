name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-test:
    name: python test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: run tests
        run: |
          python3 scripts/team-session_test.py
          python3 scripts/session_context_test.py
          python3 scripts/session_hook_test.py
          python3 scripts/orchestrator_test.py
          python3 scripts/team-session.py check

  rulesync-regen:
    name: rulesync regen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
      - name: regenerate and compare
        run: |
          set -euo pipefail
          npm install -g rulesync@43.14.0
          test "$(rulesync --version)" = "43.14.0"
          rulesync generate --targets claudecode,codexcli
          git diff --exit-code -- CLAUDE.md AGENTS.md

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: install gitleaks 8.30.1
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          test "$("$RUNNER_TEMP/gitleaks" version)" = "8.30.1"
      - name: scan working tree
        run: |
          "$RUNNER_TEMP/gitleaks" detect --source . --no-git -v
      - name: scan added commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            range="${BASE_SHA}..HEAD"
          elif [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            range="-1"
          else
            range="${BEFORE_SHA}..HEAD"
          fi
          echo "range ${range}"
          "$RUNNER_TEMP/gitleaks" detect --source . --log-opts="${range}" -v
